<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakido — Unified Academic Portal for Students</title>
    <link rel="icon" type="image/png" href="/logos/main_logo_sakido.png" />
    <link rel="shortcut icon" type="image/png" href="/logos/main_logo_sakido.png" />
    <link rel="apple-touch-icon" href="/logos/main_logo_sakido.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Marko+One&family=Syne:wght@700;800&family=Tilt+Warp&display=swap" rel="stylesheet">
    <link rel="preload" as="image" href="/frames/ezgif-frame-001.webp" type="image/webp" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sakido_theme_mode');
          if (saved !== null) {
            if (JSON.parse(saved) === true) document.documentElement.classList.add('dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
