<style>
        body {
            background-color: #fff8f5; /* surface */
            color: #1f1b18; /* on-surface */
        }
        
        .analog-clock-container {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 1px solid #d5c3b8; /* outline-variant */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clock-center {
            width: 4px;
            height: 4px;
            background-color: #1f1b18;
            border-radius: 50%;
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            background-color: #1f1b18;
            border-radius: 2px;
        }

        .hour-hand {
            width: 2px;
            height: 30px;
            transform: translateX(-50%) rotate(45deg); /* Static for visual */
        }

        .minute-hand {
            width: 1px;
            height: 45px;
            transform: translateX(-50%) rotate(180deg); /* Static for visual */
        }
        
        .tick {
            position: absolute;
            width: 1px;
            height: 4px;
            background-color: #d5c3b8;
            top: 4px;
            left: 50%;
            transform-origin: 50% 56px; /* 120/2 - 4 */
        }

        .toggle-checkbox:checked {
            right: 0;
            border-color: #8b5e3c;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #8b5e3c;
        }
    </style>

checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-outline-variant"><label for="gmail" class="toggle-label block overflow-hidden h-5 rounded-full bg-outline-variant cursor-pointer"></label></div></li></ul><div class="mb-4 text-xs font-bold text-secondary uppercase tracking-wider">Other</div><ul class="space-y-sm"><li><button class="w-full flex items-center gap-md px-md py-sm rounded-DEFAULT text-secondary opacity-50 hover:bg-surface-container-low transition-colors scale-95"><span class="material-symbols-outlined text-[20px] font-light">info</span><span>University &amp; People</span></button></li><li><button class="w-full flex items-center gap-md px-md py-sm rounded-DEFAULT text-secondary opacity-50 hover:bg-surface-container-low transition-colors scale-95"><span class="material-symbols-outlined text-[20px] font-light">info</span><span>AI Features</span></button></li></ul><ul class="space-y-sm border-t border-outline-variant pt-md mt-auto"><li><a class="flex items-center gap-md px-md py-sm rounded-DEFAULT text-secondary hover:bg-surface-container-low transition-colors scale-95" href="#"><span class="material-symbols-outlined text-[20px] font-light">settings</span><span>Settings</span></a></li></ul></nav><main class="ml-64 flex-1 flex flex-col min-h-screen relative w-full"><header class="bg-transparent text-primary dark:text-primary-fixed-dim font-headline-lg text-headline-lg dark:text-on-surface docked full-width top-0 flex justify-between items-center w-full px-margin-desktop py-md absolute z-10"><div class="hidden">Sakido</div><div class="absolute inset-0 bg-surface-container-highest/20 h-48 -z-10" style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuDe4vi7XJaiQ_y6qHVBWtwxJT55vq5sudKnrI-Hpl8ZD3YwwUYUEgtmD5YjHpKMDwF9O6SdtCmD5EAPaWqMNQQVKvCjNr7fYhKnLF04RHwraB-EoRih4deKj5q6ozMf8ySu0ujlI9URS4op71sfgi0YXvENKCoKbzckrD3CiQD4_QBB3MFXuygwE7JqHOA6oUjRhBBJfDmeeda3L6QWJQV1KIgQnVRYIMSCPyd3p-zS7-opLoXSVtZZ&quot;); background-size: cover; background-position: center center;"></div><div class="flex-1 flex justify-end gap-md"><button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface/50 border border-outline-variant backdrop-blur-sm text-on-surface-variant hover:opacity-80 transition-opacity cursor-pointer active:scale-95 transition-all"><span class="material-symbols-outlined text-[20px] font-light">dark_mode</span></button><button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface/50 border border-outline-variant backdrop-blur-sm text-on-surface-variant hover:opacity-80 transition-opacity cursor-pointer active:scale-95 transition-all"><span class="material-symbols-outlined text-[20px] font-light">edit</span></button></div></header><div class="px-margin-desktop pt-40 pb-xl flex-1 flex flex-col"><div class="mb-xxl"><h2 class="font-display text-display text-on-surface tracking-tight relative">Good morning, Alex.</h2></div><div class="grid grid-cols-12 gap-gutter flex-1"><div class="col-span-4 flex flex-col gap-xl"><div class="flex flex-col items-start gap-md"><div class="analog-clock-container bg-surface-container-lowest"><div class="tick" style="transform: translateX(-50%) rotate(0deg);"></div><div class="tick" style="transform: translateX(-50%) rotate(90deg);"></div><div class="tick" style="transform: translateX(-50%) rotate(180deg);"></div><div class="tick" style="transform: translateX(-50%) rotate(270deg);"></div><div class="hour-hand"></div><div class="minute-hand"></div><div class="clock-center"></div></div><div class="text-secondary"><p class="font-label-caps uppercase tracking-widest text-on-surface-variant">Wednesday</p><p class="font-body-sm mt-xs">October 24</p></div></div></div><div class="col-span-8 flex flex-col gap-lg pl-lg border-l border-outline-variant/30 min-h-[400px]"><h3 class="font-headline-lg text-headline-lg text-on-surface mb-md">Classes</h3><form class="flex gap-2 mb-4"><input type="text" placeholder="Class Name" class="border border-outline-variant rounded p-2 flex-1 bg-surface-container-lowest text-on-surface" value=""><button type="submit" class="bg-[#8b5e3c] text-white px-4 py-2 rounded">Add Class</button></form><div class="grid grid-cols-2 gap-4"><div class="col-span-2 w-full h-48 border border-outline-variant border-dashed rounded-lg flex flex-col items-center justify-center gap-md text-secondary"><div class="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center"><span class="material-symbols-outlined text-[24px] font-light">school</span></div><span class="font-body-md">No classes yet</span></div></div></div></div></div></main></div></div>
<script type="text/babel">
    const { useState, useEffect } = React;

    const App = ({ bannerImageUrl = "https://lh3.googleusercontent.com/aida-public/AB6AXuDe4vi7XJaiQ_y6qHVBWtwxJT55vq5sudKnrI-Hpl8ZD3YwwUYUEgtmD5YjHpKMDwF9O6SdtCmD5EAPaWqMNQQVKvCjNr7fYhKnLF04RHwraB-EoRih4deKj5q6ozMf8ySu0ujlI9URS4op71sfgi0YXvENKCoKbzckrD3CiQD4_QBB3MFXuygwE7JqHOA6oUjRhBBJfDmeeda3L6QWJQV1KIgQnVRYIMSCPyd3p-zS7-opLoXSVtZZ", onEditBanner, initialIsDarkMode = false, onToggleDarkMode, userName = "Alex" }) => {
        const [isDarkMode, setIsDarkMode] = useState(initialIsDarkMode);
        const [activeTab, setActiveTab] = useState('Classes');
        
        const [connectors, setConnectors] = useState({
            googleCalendar: false,
            googleDrive: false,
            gmail: false
        });

        const [classes, setClasses] = useState([]);
        const [newClassName, setNewClassName] = useState('');
        
        const [tasks, setTasks] = useState([]);
        const [newTaskName, setNewTaskName] = useState('');
        const [newTaskGrade, setNewTaskGrade] = useState('');

        const [watchLater, setWatchLater] = useState([]);
        const [newWatchUrl, setNewWatchUrl] = useState('');
        const [newWatchTitle, setNewWatchTitle] = useState('');

        useEffect(() => {
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }, [isDarkMode]);

        const toggleDark = () => {
            setIsDarkMode(!isDarkMode);
            if(onToggleDarkMode) onToggleDarkMode(!isDarkMode);
        }

        const addClass = (e) => {
            e.preventDefault();
            if(newClassName) {
                setClasses([...classes, { id: Date.now(), name: newClassName }]);
                setNewClassName('');
            }
        }

        const addTask = (e) => {
            e.preventDefault();
            if(newTaskName) {
                setTasks([...tasks, { id: Date.now(), name: newTaskName, grade: newTaskGrade, checked: false }]);
                setNewTaskName('');
                setNewTaskGrade('');
            }
        }

        const toggleTask = (id) => {
            setTasks(tasks.map(t => t.id === id ? { ...t, checked: !t.checked } : t));
        }

        const addWatch = (e) => {
            e.preventDefault();
            if(newWatchTitle) {
                setWatchLater([...watchLater, { id: Date.now(), title: newWatchTitle, url: newWatchUrl }]);
                setNewWatchTitle('');
                setNewWatchUrl('');
            }
        }

        const removeWatch = (id) => {
            setWatchLater(watchLater.filter(w => w.id !== id));
        }

        const handleConnectorToggle = (key) => {
            setConnectors(prev => ({...prev, [key]: !prev[key]}));
        }

        const avgGrade = tasks.filter(t => t.grade).length > 0 ? 
            Math.round(tasks.filter(t => t.grade).reduce((acc, t) => acc + parseInt(t.grade), 0) / tasks.filter(t => t.grade).length) : 0;

        const renderContent = () => {
            if (['University & People', 'AI Features'].includes(activeTab)) {
                return (
                    <div className="flex-1 flex items-center justify-center min-h-[400px]">
                        <h2 className="text-secondary font-display text-headline-lg tracking-widest uppercase">Coming Soon</h2>
                    </div>
                );
            }

            if (activeTab === 'Classes') {
                return (
                    <div className="col-span-8 flex flex-col gap-lg pl-lg border-l border-outline-variant/30 min-h-[400px]">
                        <h3 className="font-headline-lg text-headline-lg text-on-surface mb-md">Classes</h3>
                        <form onSubmit={addClass} className="flex gap-2 mb-4">
                            <input type="text" value={newClassName} onChange={(e) => setNewClassName(e.target.value)} placeholder="Class Name" className="border border-outline-variant rounded p-2 flex-1 bg-surface-container-lowest text-on-surface" />
                            <button type="submit" className="bg-[#8b5e3c] text-white px-4 py-2 rounded">Add Class</button>
                        </form>
                        <div className="grid grid-cols-2 gap-4">
                            {classes.map(c => (
                                <div key={c.id} className="p-4 border border-outline-variant rounded-lg bg-surface-container-low shadow-sm">
                                    <h4 className="font-headline-md">{c.name}</h4>
                                </div>
                            ))}
                            {classes.length === 0 && (
                                <div className="col-span-2 w-full h-48 border border-outline-variant border-dashed rounded-lg flex flex-col items-center justify-center gap-md text-secondary">
                                    <div className="w-12 h-12 rounded-full border border-outline-variant flex items-center justify-center">
                                        <span className="material-symbols-outlined text-[24px] font-light">school</span>
                                    </div>
                                    <span className="font-body-md">No classes yet</span>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (activeTab === 'Tasks & Grades') {
                return (
                    <div className="col-span-8 flex flex-col gap-lg pl-lg border-l border-outline-variant/30 min-h-[400px]">
                        <div className="flex justify-between items-center mb-md">
                            <h3 className="font-headline-lg text-headline-lg text-on-surface">Tasks & Grades</h3>
                            {avgGrade > 0 && <div className="text-primary-container font-bold">Grade Avg: {avgGrade}%</div>}
                        </div>
                        <form onSubmit={addTask} className="flex gap-2 mb-4">
                            <input type="text" value={newTaskName} onChange={(e) => setNewTaskName(e.target.value)} placeholder="Task Name" className="border border-outline-variant rounded p-2 flex-1 bg-surface-container-lowest text-on-surface" />
                            <input type="number" min="0" max="100" value={newTaskGrade} onChange={(e) => setNewTaskGrade(e.target.value)} placeholder="Grade (0-100)" className="border border-outline-variant rounded p-2 w-32 bg-surface-container-lowest text-on-surface" />
                            <button type="submit" className="bg-[#8b5e3c] text-white px-4 py-2 rounded">Add</button>
                        </form>
                        <div className="flex flex-col gap-2">
                            {tasks.map(t => (
                                <div key={t.id} className="flex items-center gap-3 p-3 border border-outline-variant rounded bg-surface-container-low">
                                    <input type="checkbox" checked={t.checked} onChange={() => toggleTask(t.id)} className="w-5 h-5 accent-[#8b5e3c]" />
                                    <span className={`flex-1 ${t.checked ? 'line-through text-secondary' : ''}`}>{t.name}</span>
                                    {t.grade && <span className="text-sm font-bold text-secondary">Grade: {t.grade}</span>}
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if (activeTab === 'Watch Later') {
                return (
                    <div className="col-span-8 flex flex-col gap-lg pl-lg border-l border-outline-variant/30 min-h-[400px]">
                        <h3 className="font-headline-lg text-headline-lg text-on-surface mb-md">Watch Later</h3>
                        <form onSubmit={addWatch} className="flex gap-2 mb-4">
                            <input type="text" value={newWatchTitle} onChange={(e) => setNewWatchTitle(e.target.value)} placeholder="Title" className="border border-outline-variant rounded p-2 flex-1 bg-surface-container-lowest text-on-surface" />
                            <input type="text" value={newWatchUrl} onChange={(e) => setNewWatchUrl(e.target.value)} placeholder="URL" className="border border-outline-variant rounded p-2 flex-1 bg-surface-container-lowest text-on-surface" />
                            <button type="submit" className="bg-[#8b5e3c] text-white px-4 py-2 rounded">Add</button>
                        </form>
                        <div className="flex flex-col gap-2">
                            {watchLater.map(w => (
                                <div key={w.id} className="flex items-center justify-between p-3 border border-outline-variant rounded bg-surface-container-low">
                                    <div className="flex flex-col">
                                        <span className="font-bold">{w.title}</span>
                                        <a href={w.url} target="_blank" className="text-sm text-blue-500 underline truncate max-w-xs">{w.url}</a>
                                    </div>
                                    <button onClick={() => removeWatch(w.id)} className="text-error text-sm hover:underline">Remove</button>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            // Fallback for Notes/Calendar
            return (
                <div className="col-span-8 flex flex-col gap-lg pl-lg border-l border-outline-variant/30 min-h-[400px]">
                     <h3 className="font-headline-lg text-headline-lg text-on-surface mb-md">{activeTab}</h3>
                     <p className="text-secondary">Select another tab to see interactive modules.</p>
                </div>
            );
        }

        return (
            <div className="flex w-full min-h-screen">
                <nav className="bg-surface dark:bg-surface font-body-md text-body-md h-screen w-64 fixed left-0 top-0 border-r border-outline-variant dark:border-outline flex flex-col py-xl px-md z-50 overflow-y-auto">
                    <div className="mb-xxl">
                        <h1 className="font-display text-headline-md text-on-surface dark:text-inverse-on-surface tracking-tight">Sakido</h1>
                        <p className="text-secondary dark:text-secondary-fixed-dim text-body-sm mt-xs">Productivity Portal</p>
                    </div>
                    
                    <div className="mb-4 text-xs font-bold text-secondary uppercase tracking-wider">Student</div>
                    <ul className="space-y-sm mb-8">
                        {['Notes', 'Calendar', 'Tasks & Grades', 'Classes', 'Watch Later'].map(item => (
                            <li key={item}>
                                <button onClick={() => setActiveTab(item)} className={`w-full flex items-center gap-md px-md py-sm rounded-DEFAULT transition-colors scale-95 transition-transform duration-150 ${activeTab === item ? 'text-primary dark:text-primary-fixed-dim font-bold bg-surface-container-low dark:bg-surface-container-highest' : 'text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest'}`}>
                                    <span className="material-symbols-outlined text-[20px] font-light">
                                        {item === 'Notes' ? 'description' : item === 'Calendar' ? 'calendar_today' : item === 'Tasks & Grades' ? 'check_circle' : item === 'Classes' ? 'school' : 'watch_later'}
                                    </span>
                                    <span>{item}</span>
                                </button>
                            </li>
                        ))}
                    </ul>

                    <div className="mb-4 text-xs font-bold text-secondary uppercase tracking-wider">Connectors</div>
                    <ul className="space-y-sm mb-8">
                        {['googleCalendar', 'googleDrive', 'gmail'].map(connector => (
                            <li key={connector} className="flex items-center justify-between px-md py-sm text-secondary">
                                <span className="capitalize">{connector.replace(/([A-Z])/g, ' $1').trim()}</span>
                                <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                    <input type="checkbox" name="toggle" id={connector} checked={connectors[connector]} onChange={() => handleConnectorToggle(connector)} className="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-outline-variant" />
                                    <label htmlFor={connector} className="toggle-label block overflow-hidden h-5 rounded-full bg-outline-variant cursor-pointer"></label>
                                </div>
                            </li>
                        ))}
                    </ul>

                    <div className="mb-4 text-xs font-bold text-secondary uppercase tracking-wider">Other</div>
                    <ul className="space-y-sm">
                        {['University & People', 'AI Features'].map(item => (
                            <li key={item}>
                                <button onClick={() => setActiveTab(item)} className="w-full flex items-center gap-md px-md py-sm rounded-DEFAULT text-secondary opacity-50 hover:bg-surface-container-low transition-colors scale-95">
                                    <span className="material-symbols-outlined text-[20px] font-light">info</span>
                                    <span>{item}</span>
                                </button>
                            </li>
                        ))}
                    </ul>

                    <ul className="space-y-sm border-t border-outline-variant pt-md mt-auto">
                        <li>
                            <a className="flex items-center gap-md px-md py-sm rounded-DEFAULT text-secondary hover:bg-surface-container-low transition-colors scale-95" href="#">
                                <span className="material-symbols-outlined text-[20px] font-light">settings</span>
                                <span>Settings</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <main className="ml-64 flex-1 flex flex-col min-h-screen relative w-full">
                    <header className="bg-transparent text-primary dark:text-primary-fixed-dim font-headline-lg text-headline-lg dark:text-on-surface docked full-width top-0 flex justify-between items-center w-full px-margin-desktop py-md absolute z-10">
                        <div className="hidden">Sakido</div>
                        <div className="absolute inset-0 bg-surface-container-highest/20 h-48 -z-10" style={{backgroundImage: `url('${bannerImageUrl}')`, backgroundSize: 'cover', backgroundPosition: 'center'}}></div>
                        <div className="flex-1 flex justify-end gap-md">
                            <button onClick={toggleDark} className="w-10 h-10 flex items-center justify-center rounded-full bg-surface/50 border border-outline-variant backdrop-blur-sm text-on-surface-variant hover:opacity-80 transition-opacity cursor-pointer active:scale-95 transition-all">
                                <span className="material-symbols-outlined text-[20px] font-light">dark_mode</span>
                            </button>
                            <button onClick={onEditBanner} className="w-10 h-10 flex items-center justify-center rounded-full bg-surface/50 border border-outline-variant backdrop-blur-sm text-on-surface-variant hover:opacity-80 transition-opacity cursor-pointer active:scale-95 transition-all">
                                <span className="material-symbols-outlined text-[20px] font-light">edit</span>
                            </button>
                        </div>
                    </header>

                    <div className="px-margin-desktop pt-40 pb-xl flex-1 flex flex-col">
                        <div className="mb-xxl">
                            <h2 className="font-display text-display text-on-surface tracking-tight relative">
                                Good morning, {userName}.
                            </h2>
                        </div>
                        
                        <div className="grid grid-cols-12 gap-gutter flex-1">
                            <div className="col-span-4 flex flex-col gap-xl">
                                <div className="flex flex-col items-start gap-md">
                                    <div className="analog-clock-container bg-surface-container-lowest">
                                        <div className="tick" style={{transform: 'translateX(-50%) rotate(0deg)'}}></div>
                                        <div className="tick" style={{transform: 'translateX(-50%) rotate(90deg)'}}></div>
                                        <div className="tick" style={{transform: 'translateX(-50%) rotate(180deg)'}}></div>
                                        <div className="tick" style={{transform: 'translateX(-50%) rotate(270deg)'}}></div>
                                        <div className="hour-hand"></div>
                                        <div className="minute-hand"></div>
                                        <div className="clock-center"></div>
                                    </div>
                                    <div className="text-secondary">
                                        <p className="font-label-caps uppercase tracking-widest text-on-surface-variant">Wednesday</p>
                                        <p className="font-body-sm mt-xs">October 24</p>
                                    </div>
                                </div>
                            </div>
                            
                            {renderContent()}
                        </div>
                    </div>
                </main>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body></html>
