<style>
        body {
            background-color: #000000; /* Force true black as requested */
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Form Autofill styles to maintain dark mode aesthetic */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #000000 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>

<body class="antialiased">
<!-- Auth Modal Container -->
<main class="w-full max-w-[480px] p-[32px] md:p-[48px] mx-4 border border-[#262626] rounded-2xl bg-[#000000] shadow-2xl flex flex-col">
<!-- Header Section -->
<header class="mb-[48px] text-center">
<h1 class="font-display text-display tracking-tighter text-primary uppercase mb-gutter">
                SAKIDO
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Get started to continue.
            </p>
</header>
<!-- Auth Actions Section -->
<section class="flex flex-col gap-[32px] w-full">
<!-- Google OAuth Button -->
<button class="w-full flex items-center justify-center gap-unit py-[16px] px-gutter border border-[#262626] bg-transparent hover:bg-primary hover:text-[#000000] text-primary font-label-md text-label-md uppercase transition-colors duration-200 group">
<span class="material-symbols-outlined text-[20px]">login</span>
<span>Continue with Google</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-[16px]">
<hr class="flex-grow border-t border-[#262626]">
<span class="font-label-sm text-label-sm text-outline uppercase">OR</span>
<hr class="flex-grow border-t border-[#262626]">
</div>
<!-- Email Input Form -->
<form class="flex flex-col gap-gutter w-full" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-unit text-left">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="email">
                        Email Address
                    </label>
<input class="w-full bg-transparent border border-[#262626] focus:border-primary focus:ring-0 text-primary font-body-md text-body-md py-[12px] px-[16px] rounded-none outline-none transition-colors duration-200" id="email" name="email" placeholder="hello@example.com" required="" type="email">
</div>
<button class="w-full py-[16px] px-gutter bg-primary text-[#000000] font-label-md text-label-md uppercase hover:bg-[#E5E5E5] transition-colors duration-200 mt-unit" type="submit">
                    Send Code
                </button>
</form>
</section>
<!-- Footer / Legal Info -->
<footer class="mt-[64px] pt-gutter border-t border-[#262626] flex flex-col gap-unit text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                By continuing, you agree to our 
                <a class="text-primary hover:underline" href="#">Terms</a> and 
                <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
            </p>
</footer>
</main>
